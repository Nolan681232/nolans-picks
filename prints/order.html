<body>
<a class="skip" href="#content">Skip to content</a>
<header class="site-header">
  <div class="wrap header-bar">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">PN</span> Nolan's 3D Prints</a>
    <nav aria-label="Prints">
      <ul class="nav-list">
        <li><a href="index.html">Shop</a></li>
        <li><a href="order.html" aria-current="page">Order</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </div>
</header>
<main id="content">
  <div class="wrap">
    <header class="hero">
      <p class="eyebrow">Flight plan · Order</p>
      <h1>Order</h1>
      <p class="tagline">Pick a print and send your details. I'll email you to confirm the price and pickup or shipping.</p>
    </header>
    <form class="form-card" action="https://formsubmit.co/nolangoldenchest@gmail.com" method="POST" accept-charset="UTF-8">
      <input type="hidden" name="_subject" value="New 3D print order">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="true">
      <input type="hidden" name="_next" value="https://nolan681232.github.io/nolans-picks/prints/thanks.html">
      <input type="text" name="_honey" autocomplete="off" tabindex="-1" aria-hidden="true" style="display:none">
      <div class="fields">
        <div id="item-field"></div>
        <noscript>
          <label class="stack" for="item-fallback">Item
            <input id="item-fallback" name="item" required placeholder="Name of the print">
          </label>
        </noscript>
        <label for="name">Name
          <input id="name" name="name" type="text" autocomplete="name" required>
        </label>
        <label for="email">Email
          <input id="email" name="email" type="email" autocomplete="email" required>
        </label>
        <label for="quantity">Quantity
          <input id="quantity" name="quantity" type="number" min="1" value="1" inputmode="numeric" required>
        </label>
        <label for="notes">Notes
          <textarea id="notes" name="notes"></textarea>
        </label>
      </div>
      <button class="btn" type="submit">Send order</button>
    </form>
  </div>
</main>
<footer class="site-footer">
  <div class="wrap">
    <p class="footer-links">
      <a href="../">Nolan's Picks</a>

  </div>
</footer>
<script src="products.js"></script>
<script>
(function () {
  const field = document.getElementById("item-field");
  const wanted = new URLSearchParams(location.search).get("item");
  const label = document.createElement("label");
  label.htmlFor = "item";
  const select = document.createElement("select");
  select.id = "item";
  select.name = "item";
  select.required = true;
  const blank = new Option("Choose a print", "");
  select.add(blank);
  let matched = false;
  (Array.isArray(PRODUCTS) ? PRODUCTS : []).forEach(p => {
    if (!p || !p.name) return;
    const opt = new Option(p.name, p.name);
    if (wanted && wanted === p.name) {
      opt.selected = true;
      matched = true;
    }
    select.add(opt);
  });
  if (wanted && !matched) {
    const extra = new Option(wanted, wanted);
    extra.selected = true;
    select.add(extra);
  }
  const note = document.createElement("p");
  note.className = "ship-note";
  note.hidden = true;
  function showPrice() {
    const product = (Array.isArray(PRODUCTS) ? PRODUCTS : []).find(p => p && p.name === select.value);
    note.replaceChildren();
    if (!product || (!product.price && !product.shippingNote)) {
      note.hidden = true;
      return;
    }
    note.hidden = false;
    if (product.price) {
      const strong = document.createElement("strong");
      strong.textContent = product.price;
      note.append(strong);
    }
    if (product.shippingNote) {
      if (product.price) note.append(document.createElement("br"));
      note.append(product.shippingNote);
    }
  }
  select.addEventListener("change", showPrice);
  showPrice();
  label.append("Item", select);
  field.append(label, note);
})();
</script>
</body>
</html>
