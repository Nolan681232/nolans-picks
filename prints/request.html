<main id="content">
  <div class="wrap">
    <header class="hero">
      <p class="eyebrow">Custom job · Request</p>
      <h1>Request a Print</h1>
      <p class="tagline">Want something that is not in the shop? Tell me what to make and I'll let you know if I can print it.</p>
    </header>
    <form class="form-card" action="https://formsubmit.co/nolangoldenchest@gmail.com" method="POST" accept-charset="UTF-8">
      <input type="hidden" name="_subject" value="New custom print request">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="true">
      <input type="hidden" name="_next" value="https://nolan681232.github.io/nolans-picks/prints/thanks.html">
      <input type="text" name="_honey" autocomplete="off" tabindex="-1" aria-hidden="true" style="display:none">
      <div class="fields">
        <label for="name">Name
          <input id="name" name="name" type="text" autocomplete="name" required>
        </label>
        <label for="email">Email
          <input id="email" name="email" type="email" autocomplete="email" required>
        </label>
        <label for="request">What you want made
          <textarea id="request" name="request" required></textarea>
        </label>
        <label for="dimensions">Size / dimensions
          <input id="dimensions" name="dimensions" type="text">
        </label>
        <label for="model">Link to a model
          <span class="hint">Thingiverse, Printables, or any model link. Optional.</span>
          <input id="model" name="model" type="url" placeholder="https://">
        </label>
        <label for="budget">Budget
          <input id="budget" name="budget" type="text" placeholder="Optional">
        </label>
        <label for="notes">Notes
          <textarea id="notes" name="notes"></textarea>
        </label>
      </div>
      <button class="btn" type="submit">Send request</button>
    </form>
  </div>
</main>
